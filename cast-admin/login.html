<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="editor-token" content="__EDITOR_TOKEN__"><meta name="site-base" content="__BASE__"><meta name="auth-mode" content="__AUTH_MODE__"><title>ورود به مدیریت سایت ۷ رخ</title><link rel="stylesheet" href="auth.css"></head><body><main class="auth-card"><p class="eyebrow">۷ رخ</p><p class="eyebrow">پورتال ۷ رخ</p><h1 id="auth-title">ورود به مدیریت سایت</h1><p id="auth-intro">با حساب کاربری خود وارد شوید.</p><form id="login-form"><label>نام کاربری<input name="username" value="eshahabian" autocomplete="username" dir="ltr" required maxlength="40"></label><label>رمز عبور<input name="password" type="password" autocomplete="current-password" dir="ltr" required maxlength="128"></label><label id="activation-label" hidden>کد فعال‌سازی اولیه<input name="activation" autocomplete="off" dir="ltr" maxlength="100"><small>این کد در فایل راهنمای اختصاصی روی لپ‌تاپ مالک سایت است و فقط بار اول لازم می‌شود.</small></label><button type="submit">ورود به پنل</button></form><form id="password-form" hidden><label>رمز فعلی<input name="current" type="password" autocomplete="current-password" dir="ltr" required maxlength="128"></label><label>رمز جدید<input name="password" type="password" autocomplete="new-password" dir="ltr" minlength="12" maxlength="128" required></label><label>تکرار رمز جدید<input name="confirm" type="password" autocomplete="new-password" dir="ltr" minlength="12" maxlength="128" required></label><button type="submit">تغییر رمز و ورود به پنل</button></form><p id="auth-error" role="alert"></p><a class="back-site" href="__BASE__/">بازگشت به سایت</a></main><script src="auth.js" defer></script></body></html>
